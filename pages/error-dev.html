<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>در حال توسعه</title>
    <style>
        :root {
            --primary-color: #4f0dca;
            --primary-light: #7a3aff;
            --primary-dark: #3a0a9a;
            --text-color: #f8f9fa;
            --bg-color: #121212;
        }

        @font-face {
            font-family: 'Vazir';
            src: url('../content/font/Vazir-Black.woff2');
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazir', sans-serif;
            font-weight: 100;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background-image:
                radial-gradient(circle at 25% 25%, var(--primary-dark) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, var(--primary-dark) 0%, transparent 50%);
            background-size: 200% 200%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 0%;
            }

            50% {
                background-position: 100% 100%;
            }

            100% {
                background-position: 0% 0%;
            }
        }

        .container {
            max-width: 800px;
            padding: 40px;
            background-color: rgba(18, 18, 18, 0.8);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(79, 13, 202, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid var(--primary-light);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from {
                box-shadow: 0 0 20px rgba(122, 58, 255, 0.3);
            }

            to {
                box-shadow: 0 0 40px rgba(122, 58, 255, 0.6);
            }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--primary-light);
            text-shadow: 0 0 10px rgba(122, 58, 255, 0.5);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .icon {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 10px var(--primary-light));
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background-color: rgba(122, 58, 255, 0.2);
            border-radius: 5px;
            margin: 30px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 65%;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-light));
            border-radius: 5px;
            animation: progress 2s ease-in-out infinite alternate;
        }

        @keyframes progress {
            from {
                width: 60%;
            }

            to {
                width: 70%;
            }
        }

        .social-links {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }

        .social-link {
            color: var(--text-color);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 50px;
            background-color: rgba(122, 58, 255, 0.2);
            border: 1px solid var(--primary-light);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .social-link:hover {
            background-color: var(--primary-light);
            box-shadow: 0 5px 15px rgba(122, 58, 255, 0.4);
        }

        .countdown {
            font-size: 1.5rem;
            margin-top: 20px;
            color: var(--primary-light);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 1rem;
            }

            .icon {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor"
                d="M17,3H7A2,2 0 0,0 5,5V19A2,2 0 0,0 7,21H17A2,2 0 0,0 19,19V5A2,2 0 0,0 17,3M7,5H17V7H7V5M7,9H17V11H7V9M7,13H13V15H7V13Z" />
        </svg>

        <h1>در حال توسعه</h1>
        <p>این صفحه در حال ساخت و توسعه می‌باشد. به زودی با امکانات جدید و طراحی زیباتر در دسترس خواهد بود.</p>

        <div class="countdown" id="countdown">برگشت به صفحه اصلی در 15 ثانیه...</div>

        <div class="social-links">
            <a href="../index.html" class="social-link">
                  بازگشت به صفحه اصلی
            </a>
        </div>
    </div>

    <script>
        // تایمر معکوس
        let seconds = 15;
        const countdownElement = document.getElementById('countdown');

        const countdown = setInterval(() => {
            seconds--;
            countdownElement.textContent = `برگشت به صفحه اصلی در 15 ثانیه...`;

            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = "../index.html"; // آدرس صفحه اصلی
            }
        }, 1000);
    </script>
</body>

</html>
